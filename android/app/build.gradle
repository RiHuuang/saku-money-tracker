apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseKeystore = System.getenv('SAKU_RELEASE_KEYSTORE')
def releaseKeyAlias = System.getenv('SAKU_RELEASE_KEY_ALIAS')
def releaseStorePassword = System.getenv('SAKU_RELEASE_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('SAKU_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = releaseKeystore && releaseKeyAlias && releaseStorePassword && releaseKeyPassword
def productionEnv = new Properties()
def productionEnvFile = rootProject.file('../.env.production')
if (productionEnvFile.exists()) productionEnvFile.withInputStream { productionEnv.load(it) }
def webApiUrl = System.getenv('VITE_SAKU_API_URL') ?: productionEnv.getProperty('VITE_SAKU_API_URL', '')
def sakuApiUrl = project.findProperty('SAKU_API_URL') ?: System.getenv('SAKU_API_URL') ?: webApiUrl
def isolatedStageDebug = project.findProperty('SAKU_ISOLATED_STAGE_DEBUG') == 'true'
if (sakuApiUrl && webApiUrl && sakuApiUrl != webApiUrl) {
    throw new GradleException('SAKU_API_URL and VITE_SAKU_API_URL must match so widget and foreground sync use the same service')
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && sakuApiUrl != 'https://app.sakumoney.my.id') {
    throw new GradleException('Release builds require SAKU_API_URL=https://app.sakumoney.my.id')
}
if (isolatedStageDebug && (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } || sakuApiUrl != 'https://stage.sakumoney.my.id')) {
    throw new GradleException('SAKU_ISOLATED_STAGE_DEBUG requires a debug build and the staging API URL')
}

android {
    namespace = "id.saku.money"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "id.saku.money"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(project.findProperty('SAKU_VERSION_CODE') ?: '10')
        versionName project.findProperty('SAKU_VERSION_NAME') ?: '2.3.0'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            sakuAppLabel: '@string/app_name',
            sakuQuickAddScheme: 'saku',
            sakuWidgetTaskAffinity: 'id.saku.money.widget',
            sakuWidgetsEnabled: 'true',
            sakuShortcutsResource: '@xml/shortcuts'
        ]
        buildConfigField "String", "SAKU_GOOGLE_WEB_CLIENT_ID", "\"${project.findProperty('SAKU_GOOGLE_WEB_CLIENT_ID') ?: ''}\""
        buildConfigField "String", "SAKU_API_URL", "\"${sakuApiUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        buildConfigField "boolean", "SAKU_WIDGETS_ENABLED", isolatedStageDebug ? 'false' : 'true'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (isolatedStageDebug) {
                applicationIdSuffix '.stage'
                manifestPlaceholders.sakuAppLabel = 'Saku Stage'
                manifestPlaceholders.sakuQuickAddScheme = 'saku-stage'
                manifestPlaceholders.sakuWidgetTaskAffinity = 'id.saku.money.stage.widget'
                manifestPlaceholders.sakuWidgetsEnabled = 'false'
                manifestPlaceholders.sakuShortcutsResource = '@xml/empty_shortcuts'
            }
        }
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.5.1'
}

apply from: 'capacitor.build.gradle'

tasks.register('generateWidgetSheetFixture', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/widget-sheet-fixture.mjs'
    inputs.files(rootProject.file('../src/sheetMirror.ts'), rootProject.file('../scripts/widget-sheet-fixture.mjs'))
    outputs.file(file('src/test/resources/sheet-parity.json'))
}
tasks.withType(Test).configureEach { dependsOn 'generateWidgetSheetFixture' }
tasks.matching { it.name.matches('process.*UnitTestJavaRes') }.configureEach {
    dependsOn 'generateWidgetSheetFixture'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
